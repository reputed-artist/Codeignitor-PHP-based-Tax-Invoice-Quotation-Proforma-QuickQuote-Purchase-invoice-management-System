<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>404 | Page Not Found</title>
     <style>
         body { margin: 0; background: #ecf0f5; color: #333; font-family: Arial, sans-serif; }
         main { max-width: 680px; margin: 10vh auto; padding: 64px 42px; text-align: center; background: #fff; border-top: 6px solid #39ac31; box-shadow: 0 4px 18px rgba(0, 0, 0, .14); }
         h1 { margin: 0 0 18px; color: #39ac31; font-size: 96px; line-height: 1; font-weight: 700; }
         h2 { margin: 0 0 14px; font-size: 34px; }
         p { color: #666; font-size: 19px; }
         a { display: inline-block; margin-top: 22px; padding: 14px 28px; color: #fff; background: #39ac31; border-radius: 4px; font-size: 18px; font-weight: 700; text-decoration: none; }
         a:hover { background: #2e8b27; color: #fff; text-decoration: none; }
     </style>
</head>
<body>
    <div class="error-page">
    <main>
               <h1>404</h1>
